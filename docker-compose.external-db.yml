services:
  app:
    build: .
    environment:
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      MAX_PENDING_REQUESTS: ${MAX_PENDING_REQUESTS:-100}
      ACCOUNT_REQUEST_TTL_MS: ${ACCOUNT_REQUEST_TTL_MS:-86400000}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:-100}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-3600000}
      REGISTER_RATE_LIMIT_MAX_ATTEMPTS: ${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:-5}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-192.168.2.90}:${DB_PORT:-5432}/${DB_NAME:-webapp}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters in .env}
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-900000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-5}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-30}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-120000}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-1}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
    ports:
      - "3000:3000"
    restart: unless-stopped
