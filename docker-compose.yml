services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://webapp:webapp_password@db:5432/webapp
      SESSION_SECRET: local-docker-secret-change-in-production
      MAX_ACCOUNTS: 5
      MAX_FILE_SIZE_MB: 30
      DB_POOL_MAX: 5
      DB_STATEMENT_TIMEOUT_MS: 120000
      MAX_CONCURRENT_UPLOADS: 1
      MAX_CONCURRENT_DOWNLOADS: 2
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
