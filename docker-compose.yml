services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webapp
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
      MAX_PENDING_REQUESTS: ${MAX_PENDING_REQUESTS:-100}
      ACCOUNT_REQUEST_TTL_MS: ${ACCOUNT_REQUEST_TTL_MS:-86400000}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:-100}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-3600000}
      REGISTER_RATE_LIMIT_MAX_ATTEMPTS: ${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:-5}
      DATABASE_URL: postgres://webapp:webapp_password@db:5432/webapp
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters in .env}
      SESSION_IDLE_TIMEOUT_MS: 900000
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      MAX_ACCOUNTS: 5
      MAX_FILE_SIZE_MB: 30
      DB_POOL_MAX: 5
      DB_STATEMENT_TIMEOUT_MS: 120000
      MAX_CONCURRENT_UPLOADS: 1
      MAX_CONCURRENT_DOWNLOADS: 2
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
